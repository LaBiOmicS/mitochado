version: '3.8'

services:
  mitochado-db:
    image: pgvector/pgvector:pg17
    container_name: mitochado_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mitochado
      POSTGRES_USER: mitochado_admin
      POSTGRES_PASSWORD: mitochado_secret_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${MITOCHADO_PORT:-5433}:5432"
    volumes:
      - mitochado_pgdata:/var/lib/postgresql/data
      - ../schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitochado_admin -d mitochado"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=512MB
      -c work_mem=32MB

volumes:
  mitochado_pgdata:
    driver: local
