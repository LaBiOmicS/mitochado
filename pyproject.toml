[project]
name = "mitochado"
version = "0.1.0"
description = "A specialized PostgreSQL database engine for Mitogenomics, Mitotranscriptomics, Mitoproteomics and Mitophylogenomics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
mitochado = "mitochado.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
